let AC=null;
function audioUnlock(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();else if(AC.state==='suspended')AC.resume();}catch(e){}}
function snd(f1,f2,d,type='square',vol=.07){
  if(!AC)return;
  try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}

  flap:()=>snd(520,820,.06,'triangle',.06),

  star:()=>{snd(660,1320,.14);setTimeout(()=>snd(990,1980,.2),90);},
  stomp:()=>snd(220,70,.12),
  hurt:()=>snd(500,60,.45,'sawtooth'),
  spring:()=>snd(180,900,.22),

  warp:()=>{snd(150,1400,.7,'triangle',.08);setTimeout(()=>snd(1400,200,.5,'sine',.05),350);},
  tap:()=>snd(700,700,.05),

  else{tapX=-1;tapY=-1;}

  inp.held=true;
}

const N=STAGES.length;

/* ---------- セーブ ---------- */
const SKEY='project_run_save_v1';
function blankSave(){return{clear:Array(N).fill(false),sp:Array.from({length:N},()=>[0,0,0]),best:Array(N).fill(0)};}

/* ---------- シナリオ（仮） ---------- */

/* ---------- 状態 ---------- */
let state='title', tick=0, stT=0;
let cur=0, def=null, L=null, enemies=[], cps=[], goalX=0, goalR=0, cpPos=null, P=null, camX=0, parts=[], banner=null;
let coins=0, got=[0,0,0], frames=0, deaths=0, firstClear=false, newBest=false, story=null;

function build(d){
  const W=d.w,g=[];
  for(let r=0;r<ROWS;r++)g.push(new Array(W).fill('.'));
  const set=(x,y,ch)=>{const r=ROWS-y;if(x>=0&&x<W&&r>=0&&r<ROWS)g[r][x]=ch;};
  d.build({
    ground:(x1,x2,h,ch='#')=>{for(let x=x1;x<=x2;x++)for(let y=1;y<=h;y++)set(x,y,ch);},
    fill:(x1,x2,y1,y2,ch)=>{for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)set(x,y,ch);},
    col:(x,y1,y2,ch='B')=>{for(let y=y1;y<=y2;y++)set(x,y,ch);},
    row:(x1,x2,y,ch)=>{for(let x=x1;x<=x2;x++)set(x,y,ch);},
    at:(x,y,ch)=>set(x,y,ch),
    pillar:(x,lo,hi,ch='C',w=2)=>{for(let i=0;i<w;i++){for(let y=1;y<lo;y++)set(x+i,y,ch);for(let y=hi+1;y<=ROWS;y++)set(x+i,y,ch);}},
  });
  return g;
}
function tile(tx,ty){if(!L||tx<0||ty<0||tx>=L.w||ty>=ROWS)return '.';return L.g[ty][tx];}
function solidAt(px,py){const tx=Math.floor(px/T),ty=Math.floor(py/T);if(tx<0)return true;if(tx>=L.w||ty<0||ty>=ROWS)return false;return SOLID.has(L.g[ty][tx]);}
function topSolidRow(tx){for(let r=0;r<ROWS;r++)if(SOLID.has(L.g[r][tx]))return r;return ROWS;}
function modeAt(px){let m=def.zones[0][1];for(const[z,md]of def.zones)if(px>=z*T)m=md;return m;}

function startStage(i){
  cur=i;def=STAGES[i];
  L={w:def.w,g:build(def),signs:def.signs||[]};
  enemies=[];cps=[];goalX=L.w-1;goalR=10;
  for(let r=0;r<ROWS;r++)for(let x=0;x<L.w;x++){
    const c=L.g[r][x];
    if(c==='e'){enemies.push({kind:'walk',x:x*T+2,y:r*T+4,w:12,h:12,vx:-0.5,vy:0,alive:true,sq:0,onGround:false});L.g[r][x]='.';}
    else if(c==='b'||c==='h'){enemies.push({kind:c==='b'?'bob':'patrol',bx:x*T+2,by:r*T+2,x:x*T+2,y:r*T+2,w:12,h:12,ph:x*0.9,alive:true,sq:0,left:true});L.g[r][x]='.';}
    else if(c==='F')cps.push({x,r});
    else if(c==='G'){goalX=x;goalR=r;L.g[r][x]='.';}
  }
  cpPos={x:def.start,r:topSolidRow(def.start)-1};
  coins=0;got=[0,0,0];frames=0;deaths=0;parts=[];banner=null;
  P={x:0,y:0,w:10,h:14,vx:0,vy:0,dir:1,onGround:false,coyote:0,buffer:0,wallLast:0,vault:0,dead:0,inv:0,anim:0,mode:null,flapT:0,gs:1,rot:0};
  respawn();P.inv=0;P.mode=modeAt(P.x+5);camX=0;
  state='ready';stT=0;
}
function respawn(){
  const p=P;p.x=cpPos.x*T+3;p.y=(cpPos.r+1)*T-p.h;p.vx=0;p.vy=0;p.dir=1;p.onGround=true;
  p.wallLast=0;p.buffer=0;p.vault=0;p.inv=90;p.gs=1;p.rot=0;
}
function startStory(key,after){story={pages:STORY[key],pi:0,n:0,after};state='story';}
function vortexPos(){return{x:goalX*T+8,y:goalR*T+8};}

/* ---------- 当たり判定 ---------- */
function moveX(e){
  e.x+=e.vx;let hit=false;const ys=[e.y+1,e.y+e.h/2,e.y+e.h-1];
  if(e.vx>0){const x=e.x+e.w;if(ys.some(y=>solidAt(x-0.01,y))){e.x=Math.floor((x-0.01)/T)*T-e.w;hit=true;}}
  else if(e.vx<0){if(ys.some(y=>solidAt(e.x,y))){e.x=(Math.floor(e.x/T)+1)*T;hit=true;}}
  return hit;
}
function moveY(e){
  e.y+=e.vy;e.onGround=false;let head=null;
  if(e.vy>0){const y=e.y+e.h;if(solidAt(e.x+1,y)||solidAt(e.x+e.w-1,y)){e.y=Math.floor(y/T)*T-e.h;e.vy=0;e.onGround=true;}}
  else if(e.vy<0){if(solidAt(e.x+1,e.y)||solidAt(e.x+e.w-1,e.y)){const ty=Math.floor(e.y/T);e.y=(ty+1)*T;e.vy=0;head=ty;}}
  return head;
}
function canVault(p){
  const fx=Math.floor((p.dir>0?p.x+p.w+1:p.x-1)/T),ty=Math.floor((p.y+p.h-1)/T);
  return SOLID.has(tile(fx,ty))&&!SOLID.has(tile(fx,ty-1))&&!SOLID.has(tile(Math.floor((p.x+p.w/2)/T),ty-1));
}
function overlap(a,b){return a.x+1<b.x+b.w-1&&a.x+a.w-1>b.x+1&&a.y+1<b.y+b.h&&a.y+a.h>b.y+1;}

/* ---------- プレイヤー ---------- */
function updPlayer(){
  const p=P;p.anim++;
  if(p.dead>0){p.dead--;p.y-=0.5;if(p.dead===0){respawn();p.mode=modeAt(p.x+5);}return;}
  if(p.inv>0)p.inv--;
  if(p.vault>0)p.vault--;
  if(p.flapT>0)p.flapT--;
  const m=modeAt(p.x+p.w/2);
  if(m!==p.mode){
    p.mode=m;banner={m,t:80};SE.mode();
    for(let i=0;i<8;i++)spark(p.x+5,p.y+7,'#d9a8ff');
    if(m!=='run'){p.dir=1;p.wallLast=0;}
    if(m==='swim'&&p.vy>SWIMP.MAXD)p.vy=SWIMP.MAXD;
  }
  const pressed=inp.pressed,held=inp.held;

  if(m==='run'){
    if(pressed)p.buffer=8;
    if(p.buffer>0){
      if(p.onGround||p.coyote>0){p.vy=RUNP.JV;p.onGround=false;p.coyote=0;p.buffer=0;SE.jump();dust(p.x+5,p.y+p.h);}
      else if(p.wallLast){p.dir=-p.wallLast;p.vy=RUNP.JV*0.95;p.wallLast=0;p.buffer=0;SE.jump();dust(p.x+(p.dir<0?p.w:0),p.y+7);}
      else p.buffer--;
    }
    p.vy+=(held&&p.vy<0)?RUNP.GH:RUNP.G;
    if(p.wallLast&&p.vy>RUNP.WALLF)p.vy=RUNP.WALLF;
    if(p.vy>RUNP.MAXF)p.vy=RUNP.MAXF;
    p.vx=RUNP.SPD*p.dir;
    p.wallLast=0;
    if(moveX(p)){
      if(p.onGround){if(canVault(p)){p.vy=-3.6;p.vault=14;}}
      else if(!p.vault)p.wallLast=p.dir;
    }
  }else if(m==='fly'){
    if(pressed){p.vy=FLYP.FLAP;p.flapT=10;SE.flap();parts.push({x:p.x+1,y:p.y+8,vx:-0.8,vy:0.6,life:16,type:'dot',c:'rgba(255,255,255,.9)'});}
    p.vy=Math.min(p.vy+FLYP.G,FLYP.MAXF);
    p.dir=1;p.vx=FLYP.SPD;moveX(p);
  }else{ // swim
    if(pressed)SE.bubble();
    if(held)p.vy=Math.max(p.vy-SWIMP.UP,SWIMP.MAXU);
    else p.vy=Math.min(p.vy+SWIMP.DOWN,SWIMP.MAXD);
    p.dir=1;p.vx=SWIMP.SPD;moveX(p);
    if(p.anim%18===0)parts.push({x:p.x+8,y:p.y+3,vx:0,vy:-0.6,life:40,type:'bub'});
  }

  const wasG=p.onGround;
  const head=moveY(p);
  if(head!==null)bump(p,head);
  if(m!=='run'){const c=CEIL[m];if(p.y<c){p.y=c;if(p.vy<0)p.vy=0;}}
  if(p.onGround){
    p.coyote=6;
    if(!wasG&&p.dir!==1)p.dir=1;   // 着地したら前向きに戻る
    const fr=Math.floor((p.y+p.h)/T);
    if(m!=='swim'&&(tile(Math.floor((p.x+1)/T),fr)==='S'||tile(Math.floor((p.x+p.w-1)/T),fr)==='S')){
      p.vy=SPRING;p.onGround=false;p.coyote=0;SE.spring();
    }
  }else if(p.coyote>0)p.coyote--;
  collect(p);
  if(p.y>ROWS*T+16)hurt(true);
}
function bump(p,ty){
  for(const tx of [Math.floor((p.x+p.w/2)/T),Math.floor((p.x+1)/T),Math.floor((p.x+p.w-1)/T)]){
    if(tile(tx,ty)==='?'){L.g[ty][tx]='X';coins++;SE.coin();parts.push({x:tx*T+8,y:ty*T-4,vx:0,vy:-3,life:22,type:'coin'});return;}
  }
}
function collect(p){
  const tx0=Math.floor(p.x/T),tx1=Math.floor((p.x+p.w-1)/T),ty0=Math.floor(p.y/T),ty1=Math.floor((p.y+p.h-1)/T);
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
    const c=tile(tx,ty);
    if(c==='o'){L.g[ty][tx]='.';coins++;SE.coin();spark(tx*T+8,ty*T+8,'#fff2a8');}
    else if(c==='1'||c==='2'||c==='3'){L.g[ty][tx]='.';got[+c-1]=1;SE.star();for(let i=0;i<3;i++)spark(tx*T+8,ty*T+8,'#ff8cc6');}
    else if(c==='^'&&p.inv===0&&p.y+p.h>ty*T+7){hurt(false);return;}
  }
  for(const f of cps)if(f.x>cpPos.x&&p.x>f.x*T){cpPos=f;SE.cp();}
  if(state==='play'&&p.x+p.w>=goalX*T-4)goal();
}
function hurt(pit){
  if(state!=='play'||P.dead)return;
  P.dead=pit?30:50;P.vy=0;deaths++;SE.hurt();
}
function goal(){
  state='goal';stT=0;SE.warp();
  const i=cur;firstClear=!save.clear[i];save.clear[i]=true;
  newBest=!save.best[i]||frames<save.best[i];if(newBest)save.best[i]=frames;
  for(let k=0;k<3;k++)if(got[k])save.sp[i][k]=1;
  persist();
}

/* ---------- 敵 ---------- */
function updEnemies(){
  const p=P,pm=modeAt(p.x+5);
  for(const e of enemies){
    if(!e.alive){if(e.sq>0)e.sq--;continue;}
    if(e.kind==='walk'){
      if(e.x>camX+VW+48)continue;
      e.vy=Math.min(e.vy+RUNP.G,RUNP.MAXF);
      if(moveX(e))e.vx=-e.vx;
      moveY(e);
      if(e.y>ROWS*T){e.alive=false;continue;}
    }else if(e.kind==='bob'){
      e.y=e.by+Math.sin(tick*0.05+e.ph)*18;
    }else{
      const s=tick*0.025+e.ph;e.x=e.bx+Math.sin(s)*28;e.left=Math.cos(s)<0;e.y=e.by+Math.sin(tick*0.08+e.ph)*3;
    }
    if(p.dead)continue;
    if(e.kind==='walk'&&pm==='run'){
      const vOver=p.y+p.h>e.y+2&&p.y<e.y+e.h;
      if(p.onGround&&vOver&&p.dir===1&&e.x-(p.x+p.w)<8&&e.x+e.w>p.x){ // 自動で飛び越える
        p.vy=-4.8;p.onGround=false;p.vault=18;SE.jump();continue;
      }
    }
    if(overlap(p,e)){
      if(pm!=='swim'&&p.vy>0&&p.y+p.h-e.y<9){
        e.alive=false;e.sq=24;p.vy=pm==='fly'?-3:(inp.held?-6.2:-4.2);SE.stomp();
        for(let i=0;i<4;i++)spark(e.x+6,e.y+6,'#c9a8ff');
      }else if((p.vault>0&&e.kind==='walk')||p.inv>0){}
      else hurt(false);
    }
  }
}

/* ---------- パーティクル ---------- */
function spark(x,y,c){parts.push({x,y,vx:(Math.random()-.5)*2.4,vy:-Math.random()*2.4,life:18,type:'dot',c});}
function dust(x,y){for(let i=0;i<3;i++)parts.push({x,y,vx:(Math.random()-.5)*1.2,vy:-Math.random()*.6,life:12,type:'dot',c:'rgba(255,255,255,.7)'});}
function updParts(){
  for(const q of parts){q.x+=q.vx;q.y+=q.vy;if(q.type==='coin')q.vy+=0.25;else if(q.type==='dot')q.vy+=0.12;q.life--;}
  parts=parts.filter(q=>q.life>0);
}
function updCam(){const t=P.x-56;camX+=(t-camX)*0.15;camX=Math.max(0,Math.min(L.w*T-VW,camX));}

/* ---------- 更新 ---------- */
function selectHit(){for(let i=0;i<N;i++){const y=selY(i);if(tapX>=16&&tapX<=176&&tapY>=y&&tapY<=y+58)return i;}return -1;}
function selY(i){return 50+i*66;}
function update(){
  tick++;
  if(banner&&banner.t>0)banner.t--;
  switch(state){
  case 'title':
    if(inp.pressed){SE.tap();state='select';}
    break;
  case 'select':
    if(inp.pressed){
      let pick=-1;
      if(tapX<0){for(let i=0;i<N;i++)if(i===0||save.clear[i-1])pick=i;}
      else pick=selectHit();
      if(pick>=0&&(pick===0||save.clear[pick-1])){
        SE.tap();const i=pick;
        if(!save.clear[i])startStory(i,()=>startStage(i));else startStage(i);
      }
    }
    break;
  case 'story':{
    const pg=story.pages[story.pi],full=pg.join('').length;
    story.n=Math.min(full,story.n+0.6);
    if(inp.pressed){
      if(story.n<full)story.n=full;
      else{story.pi++;story.n=0;SE.tap();if(story.pi>=story.pages.length)story.after();}
    }
    break;}
  case 'ready':
    stT++;
    if(inp.pressed&&tapX>VW-24&&tapY<20){state='select';break;}
    if(stT>=80)state='play';
    updCam();
    break;
  case 'play':
    if(inp.pressed&&tapX>VW-24&&tapY<20){state='select';break;}
    frames++;
    updPlayer();updEnemies();updCam();updParts();
    break;
  case 'goal':{
    stT++;const v=vortexPos();
    P.x+=(v.x-(P.x+5))*0.1;P.y+=(v.y-(P.y+7))*0.1;
    P.gs=Math.max(0,1-stT/45);P.rot+=0.35;P.anim++;
    updEnemies();updCam();updParts();
    if(stT%6===0)spark(v.x+(Math.random()-.5)*40,v.y+(Math.random()-.5)*40,['#b06cff','#5fe0ff','#fff'][stT%3]);
    if(stT>=100){state='result';stT=0;}
    break;}
  case 'result':
    stT++;
    if(inp.pressed&&stT>30){
      SE.tap();
      if(cur===N-1&&firstClear)startStory('end',()=>{state='select';});
      else state='select';
    }
    break;
  }
  inp.pressed=false;
}

  }else{ // 鳥
    const l=e.kind==='patrol'?e.left:true;cx.save();cx.translate(x+6,y+6);cx.scale(l?1:-1,1);
    R(-5,-2,9,6,'#3a3a5a');R(-7,-1,2,2,'#f5a623');R(-4,-1,2,2,'#fff');R(-4,0,1,1,'#000');
    if(f){R(-1,-7,5,5,'#55557a');}else{R(-1,3,5,4,'#55557a');}
    cx.restore();
  }
}
function drawWater(cam){
  const zs=def.zones;
  for(let i=0;i<zs.length;i++){
    if(zs[i][1]!=='swim')continue;
    const x1=zs[i][0]*T-cam,x2=(i+1<zs.length?zs[i+1][0]*T:L.w*T)-cam;
    if(x2<0||x1>VW)continue;
    const a=Math.max(0,x1),b=Math.min(VW,x2);
    R(a,32,b-a,VH-32,'rgba(40,140,220,.28)');
    for(let x=Math.floor(a);x<b;x+=4){const w=Math.round(Math.sin((x+cam)/10+tick/15)*1.5);R(x,31+w,4,2,'rgba(210,245,255,.75)');}
  }
}
function drawPortals(cam){
  for(let i=1;i<def.zones.length;i++){
    const x=def.zones[i][0]*T-cam;if(x<-12||x>VW+12)continue;
    for(let y=24;y<VH;y+=6){const w=3+Math.round(Math.sin(y/14+tick/8)*2);R(x-w,y,w*2,4,`rgba(190,120,255,${0.25+0.15*Math.sin(y/9+tick/10)})`);}
  }
}
function drawWorld(){
  const th=THEMES[cur],cam=Math.round(camX),v=vortexPos();
  drawBG(th,cam,cur);
  drawPortals(cam);
  for(const[sx,sy,s]of L.signs){const x=sx*T-cam;if(x>-120&&x<VW+20)txt(s,x,(ROWS-sy)*T,'#fff',10,'left','rgba(0,0,0,.6)');}
  if(v.x-cam>-60&&v.x-cam<VW+80){if(def.monster&&state!=='result')drawMonster(v.x,v.y,cam);drawVortex(v.x-cam,v.y);}
  const x0=Math.max(0,Math.floor(cam/T)-1),x1=Math.min(L.w-1,x0+Math.ceil(VW/T)+2);
  for(let r=0;r<ROWS;r++)for(let tx=x0;tx<=x1;tx++){const c=L.g[r][tx];if(c!=='.')drawTile(c,tx*T-cam,r*T,tx,r,th);}
  for(const e of enemies)if(e.x-cam>-20&&e.x-cam<VW+20)drawEnemy(e,cam);
  for(const q of parts){
    if(q.type==='coin')R(Math.round(q.x-cam)-3,Math.round(q.y)-5,6,10,'#f5c542');
    else if(q.type==='bub'){cx.strokeStyle='rgba(220,250,255,.8)';cx.lineWidth=1;cx.beginPath();cx.arc(q.x-cam,q.y,2,0,7);cx.stroke();}
    else R(Math.round(q.x-cam),Math.round(q.y),2,2,q.c);
  }
  drawPlayer(P,cam);
  drawWater(cam);
}
function drawHUD(){
  R(0,0,VW,20,'rgba(0,0,0,.5)');
  R(5,5,7,10,'#d49a1c');R(6,6,5,8,'#f5c542');txt('×'+coins,15,4,'#fff',11);
  for(let k=0;k<3;k++){R(56+k*13,5,10,10,got[k]?'#ff5fa2':'rgba(255,255,255,.18)');if(got[k])R(60+k*13,6,2,8,'#fff');}
  txt(fmt(frames),164,4,'#fff',11,'right');
  R(VW-22,2,19,16,'rgba(255,255,255,.18)');txt('✕',VW-12.5,3,'#fff',11,'center');
}
function panel(x,y,w,h){R(x,y,w,h,'rgba(10,12,28,.88)');R(x,y,w,1,'#ffd45e');R(x,y+h-1,w,1,'#ffd45e');R(x,y,1,h,'#ffd45e');R(x+w-1,y,1,h,'#ffd45e');}
function drawBanner(){
  if(!banner||banner.t<=0)return;
  const a=Math.min(1,banner.t/15),info=MODE_INFO[banner.m];
  cx.globalAlpha=a;
  R(0,96,VW,46,'rgba(40,10,70,.8)');R(0,96,VW,1,'#d9a8ff');R(0,141,VW,1,'#d9a8ff');
  txt(info.label+'!',VW/2,100,'#ffd45e',18,'center');
  txt(info.hint,VW/2,124,'#fff',10,'center');
  cx.globalAlpha=1;
}

function draw(){
  cx.setTransform(SC,0,0,SC,0,0);cx.imageSmoothingEnabled=false;
  switch(state){
  case 'title':{
    drawBG(THEMES[0],tick*1.5,0);
    R(0,VH-48,VW,48,THEMES[0].dirt);R(0,VH-48,VW,4,THEMES[0].top);
    txt('PROJECT',VW/2,80,'#fff',18,'center','#1a3a6a');
    txt('RUN',VW/2,100,'#ffd45e',40,'center','#1a3a6a');
    txt('（仮タイトル）',VW/2,146,'#fff',10,'center','#1a3a6a');
    const dp={x:VW/2-5,y:VH-62,dir:1,onGround:true,anim:tick,inv:0,dead:0,wallLast:0,vy:0,mode:'run'};drawPlayer(dp,0);
    if((tick>>5)%2===0)txt('TAP TO START',VW/2,210,'#fff',12,'center','#1a3a6a');
    break;}
  case 'select':{
    drawBG(THEMES[0],tick*0.5,0);R(0,0,VW,VH,'rgba(0,0,20,.4)');
    txt('STAGE SELECT',VW/2,20,'#fff',14,'center');
    for(let i=0;i<N;i++){
      const un=i===0||save.clear[i-1],y=selY(i),d=STAGES[i];
      panel(16,y,160,58);
      txt('STAGE '+(i+1),26,y+6,un?'#ffd45e':'#777',10);
      if(save.clear[i])txt('CLEAR',166,y+6,'#2ecc71',10,'right');
      txt(un?THEMES[i].name:'？？？',26,y+19,un?'#fff':'#666',13);
      if(un){
        const ms=[...new Set(d.zones.map(z=>MODE_INFO[z[1]].label))].join('/');
        txt(ms,166,y+21,'#b9a8ff',9,'right');
        for(let k=0;k<3;k++)R(26+k*14,y+40,10,10,save.sp[i][k]?'#ff5fa2':'rgba(255,255,255,.18)');
        if(save.best[i])txt('BEST '+fmt(save.best[i]),166,y+40,'#cde',10,'right');
      }
    }
    break;}
  case 'story':{
    R(0,0,VW,VH,'#0b0b16');
    for(let k=0;k<30;k++)R((k*61)%VW,(k*89)%VH,1,1,'#334');
    const pg=story.pages[story.pi];let left=Math.floor(story.n);
    panel(8,84,176,164);
    pg.forEach((ln,i)=>{const s=ln.slice(0,Math.max(0,left));left-=ln.length;txt(s,18,98+i*20,'#fff',11,'left',null);});
    if(story.n>=pg.join('').length&&(tick>>4)%2)txt('▼',174,232,'#ffd45e',10,'right',null);
    txt((story.pi+1)+'/'+story.pages.length,VW/2,256,'#556',10,'center',null);
    break;}
  case 'ready':case 'play':case 'goal':{
    drawWorld();drawHUD();
    if(state==='ready'){
      txt(stT<50?'READY?':'GO!',VW/2,110,'#fff',20,'center');
      txt('STAGE '+(cur+1)+'  '+THEMES[cur].name,VW/2,140,'#ffd45e',11,'center');
      txt(MODE_INFO[P.mode].hint,VW/2,158,'#fff',10,'center');
    }
    if(state==='play')drawBanner();
    if(state==='goal'&&stT>30)txt('DIMENSION CLEAR!',VW/2,110,'#ffd45e',16,'center');
    break;}
  case 'result':{
    drawWorld();R(0,0,VW,VH,'rgba(0,0,0,.45)');
    panel(16,70,160,170);
    txt('DIMENSION CLEAR!',VW/2,84,'#ffd45e',13,'center');
    txt('TIME',30,116,'#cde',11);txt(fmt(frames),162,116,'#fff',11,'right');
    if(newBest)txt('NEW BEST!',162,130,'#ff8cc6',10,'right');
    txt('COIN',30,146,'#cde',11);txt(''+coins,162,146,'#fff',11,'right');
    txt('MISS',30,166,'#cde',11);txt(''+deaths,162,166,'#fff',11,'right');
    txt('SPECIAL',30,190,'#cde',11);
    for(let k=0;k<3;k++)R(116+k*16,190,12,12,got[k]?'#ff5fa2':'rgba(255,255,255,.18)');
    if(stT>30&&(tick>>4)%2)txt('TAP',VW/2,220,'#fff',10,'center');
    break;}
  }
}

/* ---------- ループ ---------- */
let last=performance.now(),acc=0;
function loop(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){update();acc-=1000/60;}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
